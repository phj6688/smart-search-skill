services:
  searxng:
    image: searxng/searxng:latest
    container_name: search-workflow-searxng
    hostname: searxng
    restart: unless-stopped
    
    ports:
      - "9090:8080"
    
    environment:
      - INSTANCE_NAME=search-workflow-searxng
      - BASE_URL=http://localhost:9090/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - CONFIG_PATH=/etc/searxng
      - DATA_PATH=/var/cache/searxng
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
      - AUTOCOMPLETE=google
      - REDIS_URL=redis://redis:6379/0
    
    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml
      - ./config/uwsgi.ini:/etc/searxng/uwsgi.ini
      - searxng-cache:/var/cache/searxng
    
    depends_on:
      - redis
    
    networks:
      - librechat-net
    
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: search-workflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis-data:/data
    
    networks:
      - librechat-net
    
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  searxng-cache:
  redis-data:

networks:
  librechat-net:
    name: librechat-net
    external: true
