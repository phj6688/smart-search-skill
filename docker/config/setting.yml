# docker/config/settings.yml
use_default_settings: true

general:
  debug: false
  instance_name: "Search Workflow SearXNG"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true

brand:
  new_issue_url: false
  docs_url: false
  public_instances: false
  wiki_url: false
  issue_url: false

search:
  safe_search: 0
  autocomplete: "google"
  autocomplete_min: 4
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "${SEARXNG_SECRET}"
  base_url: "http://localhost:9090/"
  image_proxy: true
  method: "GET"

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: true
  infinite_scroll: false

# Optimized engines for news search
engines:
  # High-quality news sources
  - name: google news
    engine: google_news
    categories: news
    language: en
    shortcut: gn
    timeout: 6.0
    disabled: false

  - name: bing news
    engine: bing_news
    categories: news
    shortcut: bn
    timeout: 6.0
    disabled: false

  - name: reuters
    engine: reuters
    categories: news
    shortcut: re
    timeout: 6.0
    disabled: false

  - name: associated press
    engine: ap_news
    categories: news
    shortcut: ap
    timeout: 6.0
    disabled: false

  - name: bbc news
    engine: bbc_news
    categories: news
    shortcut: bbc
    timeout: 6.0
    disabled: false

  # Disable unnecessary engines for performance
  - name: wikipedia
    disabled: true
  - name: wikidata  
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true

# Redis caching for performance  
redis:
  url: "redis://redis:6379/0"

# Rate limiting
limiter:
  enabled: true
  rate: 60  # searches per minute
  burst: 600  # searches per hour

# Request settings
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  useragent_suffix: "SearchWorkflow"
  
# Supported locales
locales:
  en: English
  de: Deutsch
  fr: Français
  es: Español
