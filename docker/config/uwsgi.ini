# docker/config/uwsgi.ini
[uwsgi]
# Application
module = searxng.webapp
callable = app

# Process management
master = true
workers = 4
threads = 4
max-requests = 1000
max-requests-delta = 50
harakiri = 30

# Memory management
reload-on-rss = 256
evil-reload-on-rss = 512

# Performance
thunder-lock = true
enable-threads = true
single-interpreter = true
lazy-apps = true

# Buffer sizes
buffer-size = 32768
post-buffering = 8192

# Socket
socket = /tmp/uwsgi.sock
chmod-socket = 666
vacuum = true

# Stats
stats = /tmp/uwsgi-stats.sock
memory-report = true

# Security
uid = searxng
gid = searxng

# Logging
disable-logging = false
log-maxsize = 10000000
