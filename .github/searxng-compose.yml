# Throwaway SearXNG for .github/workflows/live-canary.yml only (HLB-649).
# Self-contained on purpose: no volumes, config, or networks shared with the
# repo's runtime compose stack. The workflow generates SEARXNG_SECRET and
# writes a minimal settings.yml (JSON format enabled) into a runner temp dir.
services:
  searxng:
    # Deliberately unpinned: the canary's job is to notice upstream drift
    # against the current image, not to freeze a known-good one.
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:9090:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?generated by the workflow step}
      SEARXNG_BASE_URL: http://127.0.0.1:9090/
      SEARXNG_LIMITER: "false"
    volumes:
      - ${SEARXNG_SETTINGS_DIR:?created by the workflow step}:/etc/searxng
